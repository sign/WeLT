# act --container-architecture linux/amd64 -j test

name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    # Megatron-Bridge and vLLM tests need a GPU and the NeMo container (see the Dockerfile), and are skipped here
    name: Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Test code
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          WANDB_MODE: disabled
        run: uv run --no-sync pytest
