name: 'Setup Environment'
description: 'Install rendering dependencies, setup uv, and install Python dependencies'

inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.12'

runs:
  using: 'composite'
  steps:
    - name: Set up Pango and Cairo
      uses: sign/pixel-renderer/.github/actions/setup-pango-cairo@main

    # ponytail: pixel-renderer 0.1.4 pins PyGObject<3.52, built against girepository-1.0 (the action installs 2.0).
    # Remove once a pixel-renderer release allows modern PyGObject.
    - name: Install girepository-1.0
      shell: bash
      run: sudo apt-get install -y libgirepository1.0-dev

    - name: Setup uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        activate-environment: true

    - name: Install dependencies
      shell: bash
      run: uv pip install ".[dev]"

