name: 'Setup Environment'
description: 'Install the rendering stack (Pango, cairo, PyGObject from conda-forge) and the Python dependencies'

runs:
  using: 'composite'
  steps:
    # conda-forge ships the latest Pango, cairo and PyGObject (as pixel-renderer's CI and the Dockerfile)
    - name: Set up the rendering stack
      uses: mamba-org/setup-micromamba@v3
      with:
        environment-name: welt
        create-args: -c conda-forge python=3.12 pango pycairo pygobject
        cache-downloads: true

    - name: Install dependencies
      shell: bash -el {0}
      run: |
        pip install ".[dev,train]"
        echo "$CONDA_PREFIX/bin" >> "$GITHUB_PATH"  # The environment's python, pytest and ruff for later steps
