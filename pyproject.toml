[project]
name = "WeLT"
description = "WeLT: Word embedding Latent Transformer - a language model designed to operate on \"words\"."
version = "0.0.1"
authors = [
    { name = "Amit Moryossef", email = "amit@sign.mt" },
]
readme = "README.md"
requires-python = ">=3.12"
# Megatron-Bridge, Megatron-Core, Transformer Engine, vLLM, torch and transformers come from the
# NeMo container (nvcr.io/nvidia/nemo:26.08.01), see the Dockerfile.
dependencies = [
    "torch",
    "transformers",
    "tokenizers",
    "safetensors",
    "huggingface_hub",
    "datasets>=4", # Older releases break with current pyarrow
    "pyyaml",
    "omegaconf", # Configs (as Megatron-Bridge)
    "cachetools", # For LRU cache in processor
    "sacrebleu", # For generation evaluation metrics
    "flask", # welt-serve
    "gunicorn", # welt-serve
    # Our packages
    "words-segmentation>=0.0.7", # For pre-tokenization into words
    "utf8-tokenizer[fast]>=0.8.5", # For tokenization and embedding of bytes
    "pixel-renderer[pangocairo]>=0.1.5", # For text rendering into images (thread safe)
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
    "matplotlib", # For benchmarks/plot.py
]

[tool.setuptools]
packages = [
    "welt",
    "welt_training",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "C90", # mccabe complexity
    "I", # isort
    "N", # pep8-naming
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "PT", # flake8-pytest-style
    "BLE", # flake8-blind-except
]

[tool.pytest.ini_options]
addopts = "-v"
# FlexAttention silently falling back to uncompiled attention (e.g. past the recompile limit) is an error
filterwarnings = ["error:.*flex_attention called without torch.compile"]
testpaths = [
    "tests",
]

[project.scripts]
welt-export = "welt.export:main"
welt-serve = "welt.server:main"
welt-generate = "welt.server:generate_main"
welt-evaluate = "welt_training.evaluate:main"

[project.entry-points."vllm.general_plugins"]
welt = "welt.vllm_plugin:register"
