[project]
name = "WeLT"
description = "WeLT: Word embedding Latent Transformer - a language model designed to operate on \"words\"."
version = "0.0.1"
authors = [
    { name = "Amit Moryossef", email = "amit@sign.mt" },
]
readme = "README.md"
requires-python = ">=3.10"
# Megatron-Bridge, Megatron-Core, Transformer Engine, vLLM, torch and transformers come from the
# NeMo container (nvcr.io/nvidia/nemo:26.08.01), see the Dockerfile.
dependencies = [
    "datasets",
    "pyyaml",
    "cachetools", # For LRU cache in processor
    "sacrebleu", # For generation evaluation metrics
    # Our packages
    "words-segmentation>=0.0.5", # For pre-tokenization into words
    "utf8-tokenizer[fast]>=0.8.2", # For tokenization of bytes
    "pixel-renderer[pangocairo]>=0.1.4", # For text rendering into images (thread safe)
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pytest",
]

[tool.setuptools]
packages = [
    "welt",
    "welt_training",
]

[tool.ruff]
line-length = 120
extend-exclude = [
    "welt_training/experiments/*",
]

[tool.ruff.lint]
select = [
    "E", # pycodestyle errors
    "W", # pycodestyle warnings
    "F", # pyflakes
    "C90", # mccabe complexity
    "I", # isort
    "N", # pep8-naming
    "UP", # pyupgrade
    "B", # flake8-bugbear
    "PT", # flake8-pytest-style
    "W605", # invalid escape sequence
    "BLE", # flake8-blind-except
]

[tool.pytest.ini_options]
markers = ["integration: tests requiring external pretrained assets"]
addopts = "-v"
testpaths = [
    "tests",
]

[project.scripts]
welt-train = "welt_training.train:train"
welt-export = "welt.export:main"
welt-generate = "welt.inference:main"
welt-prepare-data = "welt_training.prepare_data:main"
welt-verify-data = "welt_training.verify_data:main"

[project.entry-points."vllm.general_plugins"]
welt = "welt.vllm_plugin:register"
