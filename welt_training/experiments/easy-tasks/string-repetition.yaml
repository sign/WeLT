output_dir: ./output/string-repetition-tiny

model:
  bytes_encoder: sign/utf8-lm-tiny  # Pretrained byte-level LM, used bidirectionally
  image_encoder: null
  latent_transformer: sbintuitions/tiny-lm
  bytes_decoder: sign/utf8-lm-tiny
  load_pretrained: true

data:
  dataset_name: Helsinki-NLP/opus-100
  dataset_config_name: en-he
  dataset_text_template:
    - "<text>\x0E{translation[en]}\x0F<repeat> "
    - "{translation[en]}"
  seq_length: 128
  max_word_length: 16
  max_eval_samples: 32
  num_workers: 8

train:
  train_iters: 10000
  micro_batch_size: 32
  global_batch_size: 32

optimizer:
  lr: 6.0e-4
  min_lr: 6.0e-5
  weight_decay: 0.001

scheduler:
  lr_warmup_iters: 500

validation:
  eval_interval: 100
  eval_iters: 1

checkpoint:
  save_interval: 1000

logger:
  log_interval: 10
  wandb_project: string-repetition
