output_dir: ./output/en-he

model:
  image_encoder: welt_training/experiments/models/image-encoder-tiny.json
  bytes_encoder: sign/utf8-lm-tiny
  latent_transformer: welt_training/experiments/models/latent-70m.json
  bytes_decoder: sbintuitions/tiny-lm

data:
  dataset_name: Helsinki-NLP/opus-100
  dataset_config_name: en-he
  dataset_text_template:
    - "<en>\x0E{translation[en]}\x0F<he> "
    - "{translation[he]}"
  seq_length: 128
  max_word_length: 16
  max_eval_samples: 256
  num_workers: 8

train:
  train_iters: 10000
  micro_batch_size: 64
  global_batch_size: 64

optimizer:
  lr: 3.0e-4
  min_lr: 3.0e-5

validation:
  eval_interval: 500
  eval_iters: 4

logger:
  log_interval: 10
  wandb_project: welt-machine-translation
