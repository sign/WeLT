output_dir: ./output/signed-to-spoken

model:
  bytes_encoder: sign/utf8-lm-tiny
  latent_transformer: welt_training/experiments/models/latent-70m.json
  bytes_decoder: sbintuitions/tiny-lm

data:
  dataset_name: sign/signbank-plus
  dataset_config_name: cleaned
  dataset_text_template:
    - "<{sign_language}>\x0E{sign_text}\x0F<{spoken_language}> "
    - "{spoken_text}"
  seq_length: 64
  max_word_length: 128  # SignWriting has lots of bytes per sign
  max_eval_samples: 256
  num_workers: 8

train:
  train_iters: 10000
  micro_batch_size: 96
  global_batch_size: 96

validation:
  eval_interval: 500
  eval_iters: 2

logger:
  wandb_project: welt-machine-translation
