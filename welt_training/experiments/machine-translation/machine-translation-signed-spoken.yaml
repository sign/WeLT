output_dir: ./output/signed-to-spoken

model:
  image_encoder: welt_training/experiments/models/image-encoder-tiny.json  # Signs rendered as SignWriting
  bytes_encoder: sign/utf8-lm-tiny
  latent_transformer: welt_training/experiments/models/latent-70m.json
  bytes_decoder: sbintuitions/tiny-lm
  hidden_dropout: 0.1  # In the latent transformer: the small dataset overfits after ~10 epochs

data:
  dataset_name: sign/signbank-plus
  dataset_config_name: cleaned
  dataset_text_template:
    - "<{sign_language}>\x0E{sign_text}\x0F<{spoken_language}> "
    - "{spoken_text}"
  seq_length: 64
  max_word_length: 128  # SignWriting has lots of bytes per sign
  max_eval_samples: 256
  num_workers: 4  # Rendering SignWriting in more workers takes more memory than a GB10 has to spare

train:
  train_iters: 10000  # 17 epochs of the 57006 packed examples
  micro_batch_size: 96
  global_batch_size: 96

optimizer:
  optimizer: muon

validation:
  eval_interval: 500
  eval_iters: 2

logger:
  wandb_project: welt-machine-translation
