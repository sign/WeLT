output_dir: ./output/monad-chat

model:
  bytes_encoder: sign/utf8-lm-tiny
  latent_transformer: PleIAs/Monad
  bytes_decoder: sign/utf8-lm-tiny
  load_pretrained: true

data:
  dataset_name: PleIAs/SYNTH
  streaming: true  # dataset is large
  max_train_samples: 1000000
  max_eval_samples: 64
  dataset_text_template:  # Following the chat format from the "Back to bytes" paper
    - "\x01user\x0E{query}\x0F\x17"
    - "\x01assistant\x05{synthetic_reasoning}\x06{synthetic_answer}\x17"
  seq_length: 1024
  max_word_length: 16  # 14 bytes + BOS + EOS
  num_workers: 8

train:
  train_iters: 10000

optimizer:
  optimizer: muon
  lr: 1.0e-3
  min_lr: 1.0e-4

scheduler:
  lr_warmup_iters: 500

validation:
  eval_interval: 1000
  eval_iters: 2

logger:
  wandb_project: welt-chat
