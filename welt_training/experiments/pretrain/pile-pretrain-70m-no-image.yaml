# Pretraining on prepared data shards (see `welt-prepare-data` in welt_training/README.md)
output_dir: ./output/welt-pile-pretrain

model:
  bytes_encoder: welt_training/experiments/models/bytes-encoder-tiny.json
  latent_transformer: welt_training/experiments/models/latent-70m.json
  bytes_decoder: sbintuitions/tiny-lm

data:
  prepared_data_path: /scratch/data/pretrain
  seq_length: 512
  max_word_length: 32
  max_eval_samples: 512
  num_workers: 8

train:
  train_iters: 143000

optimizer:
  lr: 1.0e-3
  min_lr: 1.0e-4
  weight_decay: 0.1

scheduler:
  lr_warmup_iters: 1430

validation:
  eval_interval: 5000
  eval_iters: 16

logger:
  wandb_project: welt-pretrain
