# Quick sanity check for the pretraining pipeline
$extends: ./pile-pretrain-70m-no-image.yaml

output_dir: ./output/test-run

data:
  prepared_data_path: null
  dataset_name: monology/pile-uncopyrighted
  streaming: true
  max_train_samples: 2000
  max_eval_samples: 16
  seq_length: 128

train:
  train_iters: 100
  micro_batch_size: 4
  global_batch_size: 4

scheduler:
  lr_warmup_iters: 10

validation:
  eval_interval: 50
  eval_iters: 2

checkpoint:
  save_interval: 100

logger:
  wandb_project: null
