# Subword causal LM baseline for climbmix-welt.yaml: the same text, transformer and training
$extends: ../machine-translation/baseline.yaml

output_dir: ./output/lm-climbmix-baseline

data:
  dataset_name: nvidia/Nemotron-ClimbMix
  dataset_config_name: null
  dataset_tokenizer: gpt2
  dataset_text_template: null
  seq_length: 340  # Tokens: as much text as climbmix-welt.yaml's 256 words (1.33 Pythia tokens per word)
  max_eval_samples: 32

validation:
  eval_interval: 250
  eval_iters: 2

logger:
  wandb_project: welt-language-modeling
