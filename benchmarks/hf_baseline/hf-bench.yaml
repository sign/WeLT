image_encoder_model_name_or_path: null
bytes_encoder_config: /bench/bert-tiny.json
latent_transformer_config: /bench/latent-70m.json
bytes_decoder_model_name_or_path: sbintuitions/tiny-lm
load_pretrained: false

dataset_name: Helsinki-NLP/opus-100
dataset_config_name: en-he
dataset_text_template: "<en>\x0E{translation[en]}\x0F<he> {translation[he]}"
max_sequence_length: 128
block_size: 128
max_word_length: 32
max_train_samples: 200000

dataloader_num_workers: 8
dataloader_prefetch_factor: 4
dataloader_pin_memory: true
dataloader_persistent_workers: true

remove_unused_columns: false
per_device_train_batch_size: 32
output_dir: /tmp/hf-bench
overwrite_output_dir: true
do_train: true
do_eval: false
max_steps: 300
learning_rate: 3.0e-4
optim: adamw_torch_fused
save_strategy: "no"
logging_steps: 50
report_to: none
bf16: true
dtype: bfloat16
